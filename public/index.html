<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetVibe - מפגשים חברתיים</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8e44ad">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <datalist id="israelCities"></datalist>

    <div id="authScreen" class="auth-overlay">
        <button id="authLangToggleBtn" class="auth-lang-btn" onclick="toggleLanguage()">English (EN)</button>

        <div class="auth-container">
            <h1>🤝 MeetVibe</h1>
            <div class="auth-tabs" id="authTabs">
                <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')" data-i18n="loginTab">התחברות</button>
                <button id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')" data-i18n="registerTab">הרשמה</button>
            </div>
            
            <form id="loginForm" class="auth-form">
                <input type="tel" id="loginPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="password" id="loginPassword" placeholder="סיסמה" data-i18n-placeholder="passwordPlaceholder" required>
                <button type="submit" data-i18n="loginBtn">היכנס למערכת</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('forgot')" data-i18n="forgotPassword">שכחתי סיסמה 🤔</a>
            </form>
            
            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="שם מלא" data-i18n-placeholder="namePlaceholder" required>
                <input type="tel" id="regPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="number" id="regAge" placeholder="גיל" data-i18n-placeholder="agePlaceholder" min="10" max="99" required>
                
                <select id="regGender" class="app-input" required>
                    <option value="" disabled selected data-i18n="genderPlaceholder">בחר מגדר</option>
                    <option value="זכר" data-i18n="genderMale">זכר</option>
                    <option value="נקבה" data-i18n="genderFemale">נקבה</option>
                    <option value="אחר" data-i18n="genderOther">אחר</option>
                </select>
                
                <input type="password" id="regPassword" placeholder="בחר סיסמה" data-i18n-placeholder="choosePasswordPlaceholder" required>
                <button type="submit" data-i18n="registerBtn">צור משתמש חדש</button>
            </form>

            <form id="forgotForm" class="auth-form" style="display: none;">
                <h3 class="reset-title" data-i18n="resetTitle">איפוס סיסמה</h3>
                <input type="tel" id="forgotPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="password" id="forgotNewPassword" placeholder="סיסמה חדשה" data-i18n-placeholder="newPasswordPlaceholder" required>
                <button type="submit" class="reset-submit-btn" data-i18n="updatePasswordBtn">עדכן סיסמה</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('login')" data-i18n="backToLogin">חזור להתחברות</a>
            </form>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="header-container">
            <button class="top-btn" onclick="toggleDarkMode()" data-i18n="nightMode">🌙 לילה</button>
            <button id="langToggleBtn" class="top-btn lang-btn" onclick="toggleLanguage()">English (EN)</button>
            <h1 class="main-title" data-i18n="appTitle">MeetVibe</h1>
            <button class="top-btn logout-btn" onclick="logout()" data-i18n="logout">🚪 התנתק</button>
        </div>

        <h3 id="welcomeMessage" class="welcome-msg"></h3>
        
        <div class="form-container">
            <h3 data-i18n="formTitle">🥂 יצירת מפגש חדש</h3>
            <div id="newGameForm">
                <input type="text" id="gameCity" list="israelCities" class="app-input" placeholder="🏙️ הקלד או בחר עיר ברשימה..." data-i18n-placeholder="cityPlaceholder" required>
                
                <select id="gameEventType" class="app-input" required>
                    <option value="" disabled selected data-i18n="eventTypePlaceholder">-- בחר סוג בילוי / ספורט --</option>
                    <optgroup label="ספורט ומשחקי כדור" data-i18n-label="groupSport">
                        <option value="כדורגל" data-i18n="typeFootball">⚽ כדורגל</option>
                        <option value="כדורסל" data-i18n="typeBasketball">🏀 כדורסל</option>
                        <option value="טניס" data-i18n="typeTennis">🎾 טניס</option>
                        <option value="כדורעף" data-i18n="typeVolleyball">🏐 כדורעף</option>
                        <option value="פינג פונג" data-i18n="typePingPong">🏓 פינג פונג</option>
                        <option value="אימון כושר" data-i18n="typeWorkout">🏋️ אימון כושר בפארק</option>
                        <option value="יוגה/פילאטיס" data-i18n="typeYoga">🧘‍♀️ יוגה / פילאטיס</option>
                        <option value="הליכה" data-i18n="typeWalking">🚶‍♂️ הליכה</option>
                        <option value="ריצה" data-i18n="typeRunning">🏃‍♀️ ריצה משותפת</option>
                        <option value="רכיבה על אופניים" data-i18n="typeCycling">🚴‍♂️ רכיבה על אופניים</option>
                    </optgroup>
                    <optgroup label="בילוי ופנאי" data-i18n-label="groupLeisure">
                        <option value="יציאה לבר/פאב" data-i18n="typePub">🍻 יציאה לבר/פאב</option>
                        <option value="מסעדה" data-i18n="typeRestaurant">🍽️ מסעדה / אוכל</option>
                        <option value="בית קפה" data-i18n="typeCafe">☕ ישיבה בבית קפה</option>
                        <option value="ים" data-i18n="typeBeach">🏖️ הליכה או ישיבה בים</option>
                        <option value="סרט/קולנוע" data-i18n="typeCinema">🍿 סרט בקולנוע</option>
                        <option value="הופעת חיה" data-i18n="typeConcert">🎸 הופעה חיה / מוזיקה</option>
                        <option value="סטנדאפ" data-i18n="typeStandup">🎭 מופע סטנדאפ</option>
                        <option value="צפייה במשחק" data-i18n="typeWatchGame">📺 צפייה במשחק ספורט</option>
                    </optgroup>
                    <optgroup label="תחביבים והעשרה" data-i18n-label="groupHobbies">
                        <option value="משחקי קופסה" data-i18n="typeBoardGames">🎲 משחקי קופסה</option>
                        <option value="גיימינג" data-i18n="typeGaming">🎮 גיימינג / קונסולות</option>
                        <option value="טיול בטבע" data-i18n="typeNature">🏕️ טיול בטבע</option>
                        <option value="סדנת בישול" data-i18n="typeCooking">🍳 סדנת בישול / אפייה</option>
                        <option value="קריאה/ספרים" data-i18n="typeReading">📖 מפגש קריאה / ספרים</option>
                    </optgroup>
                    <option value="אחר" data-i18n="typeOther">✨ משהו אחר</option>
                </select>

                <select id="gamePrefGender" class="app-input">
                    <option value="לא משנה" selected data-i18n="prefGenderAny">👥 מגדר מועדף: לא משנה</option>
                    <option value="זכר" data-i18n="prefGenderMale">♂️ רק גברים</option>
                    <option value="נקבה" data-i18n="prefGenderFemale">♀️ רק נשים</option>
                </select>
                
                <input type="number" id="gameMissingPlayers" class="app-input" placeholder="כמה אנשים חסרים?" data-i18n-placeholder="missingPlayersPlaceholder" min="1" max="50" required>
                
                <div class="age-inputs-wrapper">
                    <input type="number" id="gameMinAge" class="app-input" placeholder="גיל מינימלי" data-i18n-placeholder="minAgePlaceholder" min="10" max="99">
                    <input type="number" id="gameMaxAge" class="app-input" placeholder="גיל מקסימלי" data-i18n-placeholder="maxAgePlaceholder" min="10" max="99">
                </div>
                
                <input type="date" id="gameDate" class="app-input date-input" required>

                <div class="time-picker-wrapper">
                    <span data-i18n="timeLabel">שעה:</span>
                    <select id="gameHour"></select><span class="time-picker-separator">:</span><select id="gameMinute"></select>
                </div>
                
                <button type="button" class="submit-btn" onclick="createNewGame()" data-i18n="submitGameBtn">צור מפגש!</button>
            </div>
        </div>

        <h2 class="section-title" data-i18n="activeGamesTitle">🔥 מפגשים פתוחים:</h2>
        
        <div class="social-filter-bar">
            <input type="text" id="filterCity" list="israelCities" placeholder="🔍 סנן לפי עיר..." data-i18n-placeholder="filterCityPlaceholder">
            <select id="filterType" onchange="filterGamesList()">
                <option value="all" data-i18n="filterTypeAll">🎭 הכל</option>
                <option value="כדורגל" data-i18n="typeFootball">⚽ כדורגל</option>
                <option value="כדורסל" data-i18n="typeBasketball">🏀 כדורסל</option>
                <option value="טניס" data-i18n="typeTennis">🎾 טניס</option>
                <option value="כדורעף" data-i18n="typeVolleyball">🏐 כדורעף</option>
                <option value="יציאה לבר/פאב" data-i18n="typePub">🍻 יציאה לבר/פאב</option>
                <option value="מסעדה" data-i18n="typeRestaurant">🍽️ מסעדה / אוכל</option>
                <option value="ים" data-i18n="typeBeach">🏖️ ים</option>
                <option value="my_games" data-i18n="filterTypeMyGames">👤 הפעילויות שלי</option>
            </select>
        </div>

        <div id="gamesList" class="games-container"></div>
    </div>

    <div id="chatModal" class="modal-overlay">
        <div class="chat-modal">
            <div class="chat-header">
                <span id="chatTitle" data-i18n="chatTitle">💬 צ'אט</span>
                <button class="chat-close-btn" onclick="closeChat()">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="הקלד הודעה..." data-i18n-placeholder="chatPlaceholder" onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <div id="whatsappModal" class="modal-overlay">
        <div class="modal-content">
            <h2 data-i18n="gameCreatedTitle">🎉 המפגש נפתח!</h2>
            <button id="waShareBtn" class="wa-btn" data-i18n="whatsappBtn">💬 שלח בוואטסאפ</button>
            <button onclick="closeModal()" class="close-modal-link" data-i18n="closeBtn">סגור</button>
        </div>
    </div>

    <div id="toastNotification">התראה חדשה!</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/lang.js?v=8.7"></script>
<script src="js/admin.js?v=8.7"></script>
<script src="js/games.js?v=8.7"></script>
<script src="js/app.js?v=8.7"></script>
<script src="js/auth.js?v=8.7"></script>
<script src="js/chat.js?v=8.7"></script>

</body>
</html>

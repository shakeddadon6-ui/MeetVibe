<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMatch - מפה ומשחקים</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- מסך הרשמה, התחברות ואיפוס סיסמה -->
    <!-- ========================================== -->
    <div id="authScreen" class="auth-overlay">
        <div class="auth-container">
            <h1>🗺️ SportMatch</h1>
            
            <div class="auth-tabs" id="authTabs">
                <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">התחברות</button>
                <button id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">הרשמה</button>
            </div>
            
            <form id="loginForm" class="auth-form">
                <input type="tel" id="loginPhone" placeholder="מספר טלפון" required>
                <input type="password" id="loginPassword" placeholder="סיסמה" required>
                <button type="submit">היכנס למגרש</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('forgot')">שכחתי סיסמה 🤔</a>
            </form>
            
            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="שם מלא" required>
                <input type="tel" id="regPhone" placeholder="מספר טלפון" required>
                <input type="password" id="regPassword" placeholder="בחר סיסמה" required>
                <button type="submit">צור משתמש חדש</button>
            </form>

            <form id="forgotForm" class="auth-form" style="display: none;">
                <h3 style="margin-top: 0; color: #e74c3c;">איפוס סיסמה</h3>
                <p style="font-size: 0.9em; color: #7f8c8d;">הזן את המספר שלך כדי לבחור סיסמה חדשה.</p>
                <input type="tel" id="forgotPhone" placeholder="מספר טלפון" required>
                <input type="password" id="forgotNewPassword" placeholder="סיסמה חדשה" required>
                <button type="submit" style="background: #e74c3c;">עדכן סיסמה</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('login')">חזור להתחברות</a>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- האפליקציה המרכזית -->
    <!-- ========================================== -->
    <div id="mainApp">
        <div class="header-container">
            <button id="darkModeToggle" class="top-btn" onclick="toggleDarkMode()">🌙 לילה</button>
            <h1 class="main-title">SportMatch</h1>
            <button class="top-btn logout-btn" onclick="logout()">🚪 התנתק</button>
        </div>

        <div id="welcomeMessage" class="welcome-bar"></div>
        
        <div class="filter-container">
            <button id="btnAll" class="sport-btn active" onclick="setSportFilter('all')">🌍 הכל</button>
            <button id="btnBasketball" class="sport-btn" onclick="setSportFilter('Basketball')">🏀 כדורסל</button>
            <button id="btnFootball" class="sport-btn" onclick="setSportFilter('Football')">⚽ כדורגל</button>
        </div>

        <div id="map"></div>
        
        <div class="form-container">
            <h3>➕ פתח משחק חדש</h3>
            <div id="newGameForm">
                <input type="text" id="searchBox" class="app-input" placeholder="🔍 הקלד שם מגרש לחיפוש מהיר...">
                <select id="courtId" class="app-input"><option value="">מחפש מיקום... 📍</option></select>
                <div id="selectedAddressDisplay"></div>
                
                <input type="number" id="missingPlayers" class="app-input" placeholder="כמה שחקנים חסרים?" min="1" max="10">
                
                <div class="time-toggle-container">
                    <button type="button" id="btnTimeNow" class="time-btn active" onclick="setTimeMode('now')">⚡ עכשיו</button>
                    <button type="button" id="btnTimeFuture" class="time-btn" onclick="setTimeMode('future')">🕰️ עתידי</button>
                </div>
                <div class="time-picker-wrapper" id="timePickerWrapper" style="display: none;">
                    <select id="gameHour"></select><span class="time-picker-separator">:</span><select id="gameMinute"></select>
                </div>
                <button type="button" class="submit-btn" onclick="createNewGame()">פתח משחק!</button>
            </div>
        </div>

        <h2 style="color: #2c3e50;">🔥 משחקים שקורים עכשיו:</h2>
        <div id="gamesList" class="games-container"></div>
    </div>

    <!-- מודלים נלווים -->
    <div id="chatModal" class="modal-overlay">
        <div class="chat-modal">
            <div class="chat-header">
                <span id="chatTitle">💬 צ'אט</span>
                <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:1.5em; cursor:pointer;">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="הקלד הודעה..." onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>
    <div id="whatsappModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: #333;">🎉 המשחק נפתח!</h2>
            <button id="waShareBtn" class="wa-btn">💬 שלח בוואטסאפ</button>
            <button onclick="closeModal()" class="close-btn" style="background:none; border:none; color:gray; text-decoration:underline; font-size: 1.1em; cursor:pointer; margin-top:10px;">סגור</button>
        </div>
    </div>

    <!-- טעינת הסקריפטים שלנו לפי סדר -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>

</body>
</html>

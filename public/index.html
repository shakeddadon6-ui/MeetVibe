<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMatch - מפגשים וספורט</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8e44ad">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
    
    <style> 
        .social-filter-bar {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: #fff;
            border-radius: 10px;
            margin: 10px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            flex-wrap: wrap;
        }
        .social-filter-bar select, .social-filter-bar input {
            flex: 1;
            min-width: 130px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <datalist id="israelCities">
        <option value="אום אל-פחם"><option value="אופקים"><option value="אור יהודה"><option value="אור עקיבא"><option value="אילת">
        <option value="אלעד"><option value="אריאל"><option value="אשדוד"><option value="אשקלון"><option value="באקה אל-גרביה">
        <option value="באר יעקב"><option value="באר שבע"><option value="בית שאן"><option value="בית שמש"><option value="ביתר עילית">
        <option value="בני ברק"><option value="בת ים"><option value="גבעת שמואל"><option value="גבעתיים"><option value="דימונה">
        <option value="הוד השרון"><option value="הרצליה"><option value="חדרה"><option value="חולון"><option value="חיפה">
        <option value="טבריה"><option value="טובאס"><option value="טייבה"><option value="טירה"><option value="טירת כרמל">
        <option value="יבנה"><option value="יהוד-מונוסון"><option value="יקנעם עילית"><option value="ירושלים"><option value="כפר יונה">
        <option value="כפר סבא"><option value="כפר קאסם"><option value="כרמיאל"><option value="לוד"><option value="מגדל העמק">
        <option value="מודיעין עילית"><option value="מודיעין-מכבים-רעות"><option value="מעלה אדומים"><option value="מעלות-תרשיחא"><option value="נהריה">
        <option value="נס ציונה"><option value="נצרת"><option value="נצרת עילית (נוף הגליל)"><option value="נשר"><option value="נתיבות">
        <option value="נתניה"><option value="סח'נין"><option value="עכו"><option value="עפולה"><option value="עראבה">
        <option value="ערד"><option value="פתח תקווה"><option value="צפת"><option value="קלנסווה"><option value="קריית אונו">
        <option value="קריית אתא"><option value="קריית ביאליק"><option value="קריית גת"><option value="קריית ים"><option value="קריית מוצקין">
        <option value="קריית מלאכי"><option value="קריית שמונה"><option value="ראש העין"><option value="ראשון לציון"><option value="רהט">
        <option value="רחובות"><option value="רמלה"><option value="רמת גן"><option value="רמת השרון"><option value="רעננה">
        <option value="שדרות"><option value="שפרעם"><option value="תל אביב-יפו">
    </datalist>

    <div id="authScreen" class="auth-overlay">
        <div class="auth-container">
            <h1>🤝 SportMatch</h1>
            <div class="auth-tabs" id="authTabs">
                <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">התחברות</button>
                <button id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">הרשמה</button>
            </div>
            
            <form id="loginForm" class="auth-form">
                <input type="tel" id="loginPhone" placeholder="מספר טלפון" required>
                <input type="password" id="loginPassword" placeholder="סיסמה" required>
                <button type="submit">היכנס למערכת</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('forgot')">שכחתי סיסמה 🤔</a>
            </form>
            
            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="שם מלא" required>
                <input type="tel" id="regPhone" placeholder="מספר טלפון" required>
                <input type="number" id="regAge" placeholder="גיל" min="10" max="99" required>
                
                <select id="regGender" required style="margin-bottom: 10px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; font-size: 1em;">
                    <option value="" disabled selected>בחר מגדר</option>
                    <option value="זכר">זכר</option>
                    <option value="נקבה">נקבה</option>
                    <option value="אחר">אחר</option>
                </select>
                
                <input type="password" id="regPassword" placeholder="בחר סיסמה" required>
                <button type="submit">צור משתמש חדש</button>
            </form>

            <form id="forgotForm" class="auth-form" style="display: none;">
                <h3 style="margin-top: 0; color: #e74c3c;">איפוס סיסמה</h3>
                <input type="tel" id="forgotPhone" placeholder="מספר טלפון" required>
                <input type="password" id="forgotNewPassword" placeholder="סיסמה חדשה" required>
                <button type="submit" style="background: #e74c3c;">עדכן סיסמה</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('login')">חזור להתחברות</a>
            </form>
        </div>
    </div>

    <!-- האפליקציה המרכזית (ללא מפה, הכל מפגשים) -->
    <div id="mainApp" style="display: none;">
        <div class="header-container" style="background: #8e44ad;">
            <button class="top-btn" onclick="toggleDarkMode()">🌙 לילה</button>
            <h1 class="main-title" style="color: white;">SportMatch</h1>
            <button class="top-btn logout-btn" onclick="logout()">🚪 התנתק</button>
        </div>

        <h3 id="welcomeMessage" style="text-align: center; color: #8e44ad; margin-top: 15px;"></h3>
        
        <div class="form-container">
            <h3>🥂 יצירת מפגש חדש</h3>
            <div id="newGameForm">
                <input type="text" id="gameCity" list="israelCities" class="app-input" placeholder="🏙️ הקלד או בחר עיר ברשימה..." required>
                
                <select id="gameEventType" class="app-input" required>
                    <option value="" disabled selected>-- בחר סוג בילוי / ספורט --</option>
                    <optgroup label="ספורט ומשחקי כדור">
                        <option value="כדורגל">⚽ כדורגל</option>
                        <option value="כדורסל">🏀 כדורסל</option>
                        <option value="טניס">🎾 טניס</option>
                        <option value="כדורעף">🏐 כדורעף</option>
                        <option value="פינג פונג">🏓 פינג פונג</option>
                        <option value="אימון כושר">🏋️ אימון כושר בפארק</option>
                        <option value="יוגה/פילאטיס">🧘‍♀️ יוגה / פילאטיס</option>
                        <option value="הליכה">🚶‍♂️ הליכה</option>
                        <option value="ריצה">🏃‍♀️ ריצה משותפת</option>
                        <option value="רכיבה על אופניים">🚴‍♂️ רכיבה על אופניים</option>
                    </optgroup>
                    <optgroup label="בילוי ופנאי">
                        <option value="יציאה לבר/פאב">🍻 יציאה לבר/פאב</option>
                        <option value="מסעדה">🍽️ מסעדה / אוכל</option>
                        <option value="בית קפה">☕ ישיבה בבית קפה</option>
                        <option value="ים">🏖️ הליכה או ישיבה בים</option>
                        <option value="סרט/קולנוע">🍿 סרט בקולנוע</option>
                        <option value="הופעת חיה">🎸 הופעה חיה / מוזיקה</option>
                        <option value="סטנדאפ">🎭 מופע סטנדאפ</option>
                        <option value="צפייה במשחק">📺 צפייה במשחק ספורט</option>
                    </optgroup>
                    <optgroup label="תחביבים והעשרה">
                        <option value="משחקי קופסה">🎲 משחקי קופסה</option>
                        <option value="גיימינג">🎮 גיימינג / קונסולות</option>
                        <option value="טיול בטבע">🏕️ טיול בטבע</option>
                        <option value="סדנת בישול">🍳 סדנת בישול / אפייה</option>
                        <option value="קריאה/ספרים">📖 מפגש קריאה / ספרים</option>
                    </optgroup>
                    <option value="אחר">✨ משהו אחר</option>
                </select>

                <select id="gamePrefGender" class="app-input">
                    <option value="לא משנה" selected>👥 מגדר מועדף: לא משנה</option>
                    <option value="זכר">♂️ רק גברים</option>
                    <option value="נקבה">♀️ רק נשים</option>
                </select>
                
                <input type="number" id="gameMissingPlayers" class="app-input" placeholder="כמה אנשים חסרים?" min="1" max="50" required>
                
                <div style="display: flex; gap: 10px; width: 90%; margin: 10px auto;">
                    <input type="number" id="gameMinAge" class="app-input" style="width: 100%; margin: 0;" placeholder="גיל מינימלי" min="10" max="99">
                    <input type="number" id="gameMaxAge" class="app-input" style="width: 100%; margin: 0;" placeholder="גיל מקסימלי" min="10" max="99">
                </div>
                
                <input type="date" id="gameDate" class="app-input" style="width: 90%; margin: 10px auto;" required>

                <div class="time-picker-wrapper" style="display: flex; margin-bottom: 15px; justify-content: center;">
                    <span style="align-self: center; margin-left: 10px;">שעה:</span>
                    <select id="gameHour"></select><span class="time-picker-separator">:</span><select id="gameMinute"></select>
                </div>
                
                <button type="button" class="submit-btn" style="background: #8e44ad;" onclick="createNewGame()">צור מפגש!</button>
            </div>
        </div>

        <h2 style="color: #2c3e50; padding-right: 15px; margin-bottom: 5px;">🔥 מפגשים פתוחים:</h2>
        
        <div class="social-filter-bar">
            <input type="text" id="filterCity" list="israelCities" placeholder="🔍 סנן לפי עיר..." oninput="filterGamesList()">
            <select id="filterType" onchange="filterGamesList()">
                <option value="all">🎭 הכל</option>
                <option value="כדורגל">⚽ כדורגל</option>
                <option value="כדורסל">🏀 כדורסל</option>
                <option value="טניס">🎾 טניס</option>
                <option value="כדורעף">🏐 כדורעף</option>
                <option value="יציאה לבר/פאב">🍻 ברים ופאבים</option>
                <option value="מסעדה">🍽️ מסעדות</option>
                <option value="ים">🏖️ ים</option>
                <option value="my_games">👤 הפעילויות שלי</option>
            </select>
        </div>

        <div id="gamesList" class="games-container"></div>
    </div>

    <!-- מודלים לצ'אט והתראות נשארו ללא שינוי -->
    <div id="chatModal" class="modal-overlay">
        <div class="chat-modal">
            <div class="chat-header">
                <span id="chatTitle">💬 צ'אט</span>
                <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:1.5em; cursor:pointer;">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="הקלד הודעה..." onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <div id="whatsappModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: #333;">🎉 המפגש נפתח!</h2>
            <button id="waShareBtn" class="wa-btn">💬 שלח בוואטסאפ</button>
            <button onclick="closeModal()" class="close-btn" style="background:none; border:none; color:gray; text-decoration:underline; font-size: 1.1em; cursor:pointer; margin-top:10px;">סגור</button>
        </div>
    </div>

    <div id="toastNotification">התראה חדשה!</div>

    <script src="js/lang.js?v=8.0"></script>
    <script src="js/app.js?v=8.0"></script>
    <script src="js/auth.js?v=8.0"></script>
    <script src="js/chat.js?v=8.0"></script>

</body>
</html>

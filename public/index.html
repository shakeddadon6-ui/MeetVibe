<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMatch - מפגשים וספורט</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8e44ad">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
    
    <style> 
        .social-filter-bar {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: #fff;
            border-radius: 10px;
            margin: 10px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            flex-wrap: wrap;
        }
        .social-filter-bar select, .social-filter-bar input {
            flex: 1;
            min-width: 130px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <datalist id="israelCities"></datalist>

    <div id="authScreen" class="auth-overlay">
        <div class="auth-container">
            <h1>🤝 SportMatch</h1>
            <div class="auth-tabs" id="authTabs">
                <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')" data-i18n="loginTab">התחברות</button>
                <button id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')" data-i18n="registerTab">הרשמה</button>
            </div>
            
            <form id="loginForm" class="auth-form">
                <input type="tel" id="loginPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="password" id="loginPassword" placeholder="סיסמה" data-i18n-placeholder="passwordPlaceholder" required>
                <button type="submit" data-i18n="loginBtn">היכנס למערכת</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('forgot')" data-i18n="forgotPassword">שכחתי סיסמה 🤔</a>
            </form>
            
            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="שם מלא" data-i18n-placeholder="namePlaceholder" required>
                <input type="tel" id="regPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="number" id="regAge" placeholder="גיל" data-i18n-placeholder="agePlaceholder" min="10" max="99" required>
                
                <select id="regGender" required style="margin-bottom: 10px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; font-size: 1em;">
                    <option value="" disabled selected data-i18n="genderPlaceholder">בחר מגדר</option>
                    <option value="זכר" data-i18n="genderMale">זכר</option>
                    <option value="נקבה" data-i18n="genderFemale">נקבה</option>
                    <option value="אחר" data-i18n="genderOther">אחר</option>
                </select>
                
                <input type="password" id="regPassword" placeholder="בחר סיסמה" data-i18n-placeholder="choosePasswordPlaceholder" required>
                <button type="submit" data-i18n="registerBtn">צור משתמש חדש</button>
            </form>

            <form id="forgotForm" class="auth-form" style="display: none;">
                <h3 style="margin-top: 0; color: #e74c3c;" data-i18n="resetTitle">איפוס סיסמה</h3>
                <input type="tel" id="forgotPhone" placeholder="מספר טלפון" data-i18n-placeholder="phonePlaceholder" required>
                <input type="password" id="forgotNewPassword" placeholder="סיסמה חדשה" data-i18n-placeholder="newPasswordPlaceholder" required>
                <button type="submit" style="background: #e74c3c;" data-i18n="updatePasswordBtn">עדכן סיסמה</button>
                <a class="forgot-pass-link" onclick="switchAuthTab('login')" data-i18n="backToLogin">חזור להתחברות</a>
            </form>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="header-container" style="background: #8e44ad;">
            <button class="top-btn" onclick="toggleDarkMode()" data-i18n="nightMode">🌙 לילה</button>
            <button id="langToggleBtn" class="top-btn" onclick="toggleLanguage()" style="background: #27ae60; color: white;">English (EN)</button>
            <h1 class="main-title" style="color: white;" data-i18n="appTitle">SportMatch</h1>
            <button class="top-btn logout-btn" onclick="logout()" data-i18n="logout">🚪 התנתק</button>
        </div>

        <h3 id="welcomeMessage" style="text-align: center; color: #8e44ad; margin-top: 15px;"></h3>
        
        <div class="form-container">
            <h3 data-i18n="formTitle">🥂 יצירת מפגש חדש</h3>
            <div id="newGameForm">
                <input type="text" id="gameCity" list="israelCities" class="app-input" placeholder="🏙️ הקלד או בחר עיר ברשימה..." data-i18n-placeholder="cityPlaceholder" required>
                
                <select id="gameEventType" class="app-input" required>
                    <option value="" disabled selected>-- בחר סוג בילוי / ספורט --</option>
                    <optgroup label="ספורט ומשחקי כדור">
                        <option value="כדורגל">⚽ כדורגל</option>
                        <option value="כדורסל">🏀 כדורסל</option>
                        <option value="טניס">🎾 טניס</option>
                        <option value="כדורעף">🏐 כדורעף</option>
                        <option value="פינג פונג">🏓 פינג פונג</option>
                        <option value="אימון כושר">🏋️ אימון כושר בפארק</option>
                        <option value="יוגה/פילאטיס">🧘‍♀️ יוגה / פילאטיס</option>
                        <option value="הליכה">🚶‍♂️ הליכה</option>
                        <option value="ריצה">🏃‍♀️ ריצה משותפת</option>
                        <option value="רכיבה על אופניים">🚴‍♂️ רכיבה על אופניים</option>
                    </optgroup>
                    <optgroup label="בילוי ופנאי">
                        <option value="יציאה לבר/פאב">🍻 יציאה לבר/פאב</option>
                        <option value="מסעדה">🍽️ מסעדה / אוכל</option>
                        <option value="בית קפה">☕ ישיבה בבית קפה</option>
                        <option value="ים">🏖️ הליכה או ישיבה בים</option>
                        <option value="סרט/קולנוע">🍿 סרט בקולנוע</option>
                        <option value="הופעת חיה">🎸 הופעה חיה / מוזיקה</option>
                        <option value="סטנדאפ">🎭 מופע סטנדאפ</option>
                        <option value="צפייה במשחק">📺 צפייה במשחק ספורט</option>
                    </optgroup>
                    <optgroup label="תחביבים והעשרה">
                        <option value="משחקי קופסה">🎲 משחקי קופסה</option>
                        <option value="גיימינג">🎮 גיימינג / קונסולות</option>
                        <option value="טיול בטבע">🏕️ טיול בטבע</option>
                        <option value="סדנת בישול">🍳 סדנת בישול / אפייה</option>
                        <option value="קריאה/ספרים">📖 מפגש קריאה / ספרים</option>
                    </optgroup>
                    <option value="אחר">✨ משהו אחר</option>
                </select>

                <select id="gamePrefGender" class="app-input">
                    <option value="לא משנה" selected>👥 מגדר מועדף: לא משנה</option>
                    <option value="זכר">♂️ רק גברים</option>
                    <option value="נקבה">♀️ רק נשים</option>
                </select>
                
                <input type="number" id="gameMissingPlayers" class="app-input" placeholder="כמה אנשים חסרים?" data-i18n-placeholder="missingPlayersPlaceholder" min="1" max="50" required>
                
                <div style="display: flex; gap: 10px; width: 90%; margin: 10px auto;">
                    <input type="number" id="gameMinAge" class="app-input" style="width: 100%; margin: 0;" placeholder="גיל מינימלי" data-i18n-placeholder="minAgePlaceholder" min="10" max="99">
                    <input type="number" id="gameMaxAge" class="app-input" style="width: 100%; margin: 0;" placeholder="גיל מקסימלי" data-i18n-placeholder="maxAgePlaceholder" min="10" max="99">
                </div>
                
                <input type="date" id="gameDate" class="app-input" style="width: 90%; margin: 10px auto;" required>

                <div class="time-picker-wrapper" style="display: flex; margin-bottom: 15px; justify-content: center;">
                    <span style="align-self: center; margin-left: 10px;">שעה:</span>
                    <select id="gameHour"></select><span class="time-picker-separator">:</span><select id="gameMinute"></select>
                </div>
                
                <button type="button" class="submit-btn" style="background: #8e44ad;" onclick="createNewGame()" data-i18n="submitGameBtn">צור מפגש!</button>
            </div>
        </div>

        <h2 style="color: #2c3e50; padding-right: 15px; margin-bottom: 5px;" data-i18n="activeGamesTitle">🔥 מפגשים פתוחים:</h2>
        
        <div class="social-filter-bar">
            <input type="text" id="filterCity" list="israelCities" placeholder="🔍 סנן לפי עיר...">
            <select id="filterType" onchange="filterGamesList()">
                <option value="all">🎭 הכל</option>
                <option value="כדורגל">⚽ כדורגל</option>
                <option value="כדורסל">🏀 כדורסל</option>
                <option value="טניס">🎾 טניס</option>
                <option value="כדורעף">🏐 כדורעף</option>
                <option value="יציאה לבר/פאב">🍻 ברים ופאבים</option>
                <option value="מסעדה">🍽️ מסעדות</option>
                <option value="ים">🏖️ ים</option>
                <option value="my_games">👤 הפעילויות שלי</option>
            </select>
        </div>

        <div id="gamesList" class="games-container"></div>
    </div>

    <div id="chatModal" class="modal-overlay">
        <div class="chat-modal">
            <div class="chat-header">
                <span id="chatTitle">💬 צ'אט</span>
                <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:1.5em; cursor:pointer;">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="הקלד הודעה..." data-i18n-placeholder="chatPlaceholder" onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <div id="whatsappModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: #333;" data-i18n="gameCreatedTitle">🎉 המפגש נפתח!</h2>
            <button id="waShareBtn" class="wa-btn" data-i18n="whatsappBtn">💬 שלח בוואטסאפ</button>
            <button onclick="closeModal()" class="close-btn" style="background:none; border:none; color:gray; text-decoration:underline; font-size: 1.1em; cursor:pointer; margin-top:10px;" data-i18n="closeBtn">סגור</button>
        </div>
    </div>

    <div id="toastNotification">התראה חדשה!</div>

    <script src="js/lang.js?v=8.2"></script>
    <script src="js/app.js?v=8.2"></script>
    <script src="js/auth.js?v=8.2"></script>
    <script src="js/chat.js?v=8.2"></script>

</body>
</html>
